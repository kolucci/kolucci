name: Temporary HomeLab archive export

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify source archive
        run: |
          test -s 2026-11-15-scheme.tar.gz
          file 2026-11-15-scheme.tar.gz
          sha256sum 2026-11-15-scheme.tar.gz

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: homelab-source-archive
          path: 2026-11-15-scheme.tar.gz
          if-no-files-found: error
          retention-days: 1
