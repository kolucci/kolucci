name: Export HomeLab scheme archive

on:
  push:
    branches:
      - main
    paths:
      - '2026-11-15-scheme.tar.gz'
      - '.github/workflows/export-scheme.yml'

permissions:
  contents: read

jobs:
  export-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -s 2026-11-15-scheme.tar.gz
          file 2026-11-15-scheme.tar.gz
          sha256sum 2026-11-15-scheme.tar.gz

      - name: Upload archive as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: homelab-scheme-source
          path: 2026-11-15-scheme.tar.gz
          if-no-files-found: error
          retention-days: 1

# Trigger export run.
