name: Temporary 2B-116 archive handoff

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-2b116-handoff.yml
      - 2B-116.zip

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify archive
        run: |
          test -s 2B-116.zip
          unzip -t 2B-116.zip
          sha256sum 2B-116.zip
      - name: Upload requested archive
        uses: actions/upload-artifact@v4
        with:
          name: 2b-116-scheme-handoff
          path: 2B-116.zip
          if-no-files-found: error
          retention-days: 1
