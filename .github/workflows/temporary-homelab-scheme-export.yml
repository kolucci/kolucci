name: Temporary HomeLab scheme export

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-homelab-scheme-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify archive exists
        run: test -s 2026-11-15-scheme.tar.gz

      - name: Upload archive as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: homelab-scheme-source
          path: 2026-11-15-scheme.tar.gz
          if-no-files-found: error
          retention-days: 1
