name: Temporary HomeLab archive handoff

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-homelab-handoff.yml
      - 2026-11-15-scheme.tar.gz

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Upload requested archive
        uses: actions/upload-artifact@v4
        with:
          name: homelab-scheme-handoff
          path: 2026-11-15-scheme.tar.gz
          if-no-files-found: error
          retention-days: 1

# refreshed for physical-cabling drawing review
